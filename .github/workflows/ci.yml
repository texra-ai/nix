name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Build
        run: nix build .#texra --print-build-logs

      - name: Smoke test
        run: |
          ./result/bin/texra --version
          ./result/bin/texra --help > /dev/null

      - name: Commit flake.lock if newly created
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain flake.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "chore: update flake.lock"
            git push
          fi
